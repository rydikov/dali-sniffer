<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <title>ESP32 Wi-Fi Console</title>
</head>
<body>
  <section class="shell app-page" id="console-page">
    <header class="topbar">
      <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="ws-state">Offline</span>
      </div>
      <div class="actions">
        <a class="nav-button" href="/devices" data-route aria-label="Open devices page" title="Devices">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 18h6m-5 3h4m-7-7a7 7 0 1 1 10 0c-.93.87-1.5 1.96-1.5 3.25h-7C8.5 15.96 7.93 14.87 7 14Z"/>
          </svg>
          <span>Devices</span>
        </a>
        <button class="icon-button" id="pause-button" type="button" aria-label="Pause updates" title="Pause updates">
          <svg class="w-[18px] h-[18px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 6H8a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Zm7 0h-1a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Z"/>
          </svg>
        </button>
        <button class="icon-button" id="clear-button" type="button" aria-label="Clear chat" title="Clear chat">
          <svg class="w-[18px] h-[18px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/>
          </svg>
        </button>
      </div>
    </header>
    <main class="messages" id="messages"></main>
    <footer class="composer">
      <form id="command-form">
        <label class="input-wrap">
          <span class="input-ghost" id="command-ghost" aria-hidden="true"></span>
          <input id="command-input" type="text" maxlength="120" placeholder="Enter command" autocomplete="off" aria-label="Command input">
        </label>
        <button id="send-button" type="submit" aria-label="Send command">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">
            <path fill="currentColor" d="M21.8 3.6a1 1 0 0 0-1.08-.2L3.72 10.7a1 1 0 0 0 .08 1.87l6.93 2.52 2.52 6.93a1 1 0 0 0 .89.66h.05a1 1 0 0 0 .92-.58l7.3-17a1 1 0 0 0-.2-1.1ZM5.99 11.58l12.94-5.55-7.29 7.29-5.65-1.74Zm8.44 7.36-1.74-5.65 7.29-7.29-5.55 12.94Z"/>
          </svg>
          <span>Send</span>
        </button>
      </form>
    </footer>
  </section>
  <section class="shell app-page devices-page" id="devices-page" hidden>
    <header class="topbar">
      <div class="page-title">
        <h1>Observed devices</h1>
      </div>
      <div class="actions">
        <a class="nav-button" href="/" data-route aria-label="Back to command monitor" title="Command monitor">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 18-6-6 6-6"/>
          </svg>
          <span>Monitor</span>
        </a>
        <button class="nav-button add-device-trigger" id="open-device-dialog" type="button" aria-label="Add device" title="Add device">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span>Add</span>
        </button>
      </div>
    </header>
    <main class="devices-content">
      <section class="devices-list-section" aria-label="Saved DALI devices">
        <div class="devices-list-heading">
          <div>
            <h2>Devices</h2>
            <p class="devices-status" id="devices-status" role="status"></p>
          </div>
          <span id="devices-count">0</span>
        </div>
        <div class="devices-list" id="devices-list"></div>
      </section>
    </main>
  </section>
  <dialog class="device-dialog" id="device-dialog" aria-labelledby="device-dialog-title">
    <form class="device-form" id="device-form" method="dialog">
      <header class="dialog-header">
        <div>
          <span class="page-kicker">DALI</span>
          <h2 id="device-dialog-title">New device</h2>
        </div>
        <button class="dialog-close" id="close-device-dialog" type="button" aria-label="Close">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6 6 18"/>
          </svg>
        </button>
      </header>
      <label class="field">
        <span>Device address</span>
        <select id="device-address" name="address" aria-label="Device address"></select>
      </label>
      <fieldset class="field-group">
        <legend>Capabilities</legend>
        <label class="check-row">
          <input id="device-brightness" name="brightness" type="checkbox">
          <span>Brightness</span>
        </label>
        <label class="check-row">
          <input id="device-color-temperature" name="colorTemperature" type="checkbox">
          <span>Color temperature</span>
        </label>
        <label class="check-row">
          <input id="device-rgbw" name="rgbw" type="checkbox">
          <span>RGBW</span>
        </label>
      </fieldset>
      <fieldset class="field-group">
        <legend>Device groups</legend>
        <div class="check-grid" id="device-groups"></div>
      </fieldset>
      <fieldset class="field-group">
        <legend>Scenes</legend>
        <div class="check-grid" id="device-scenes"></div>
      </fieldset>
      <div class="form-footer">
        <p class="form-status" id="device-form-status" role="status"></p>
        <div class="dialog-actions">
          <button class="secondary-button" id="cancel-device-button" type="button">Cancel</button>
          <button id="add-device-button" type="submit">Add</button>
        </div>
      </div>
    </form>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
